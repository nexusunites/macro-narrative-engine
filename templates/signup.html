<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · MNE</title><link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}"></head>
<body><main class="auth-shell"><a class="brand" href="/">Macro Narrative Engine</a><section class="auth-card"><p class="eyebrow">Account</p><h1>Create an account</h1><p>Your preferences and saved views will be stored with this account.</p>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/signup"><label>Display name<input name="display_name" maxlength="120" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><label><input type="checkbox" name="accept_terms" value="yes" required> I accept the terms.</label><label><input type="checkbox" name="accept_privacy" value="yes" required> I accept the privacy notice.</label><button type="submit">Create account</button></form><p><a href="/login">Already have an account?</a></p></section></main></body></html>
