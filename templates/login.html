<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · MNE</title><link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}"></head>
<body><main class="auth-shell"><a class="brand" href="/">Macro Narrative Engine</a><section class="auth-card"><p class="eyebrow">Account</p><h1>Sign in</h1><p>Use your MNE account to access preferences and saved work.</p>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p><a href="/signup">Create an account</a></p></section></main></body></html>
