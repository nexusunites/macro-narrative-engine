<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · MNE</title><link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}"></head><body><main class="auth-shell"><section class="auth-card"><h1>Set a new password</h1>{% if error %}<p class="auth-error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="token" value="{{ token }}"><label>New password<input type="password" name="password" minlength="10" required></label><button>Set password</button></form></section></main></body></html>
